{%- assign item = include.item -%}
{%- assign scene = include.scene -%}
<div class="helios-possibility__stage">
  <figure class="helios-possibility__art"{% if item.caption %} aria-label="{{ item.caption | escape }}"{% endif %}>
    <div class="helios-possibility__plane helios-possibility__echo">
      <img src="{{ scene.echo | relative_url }}" alt="" width="{{ scene.echo_width }}" height="{{ scene.echo_height }}" loading="lazy" decoding="async">
    </div>
    {%- if scene.memory -%}
    <div class="helios-possibility__plane helios-possibility__memory" aria-hidden="true">
      <img src="{{ scene.memory | relative_url }}" alt="" width="{{ scene.memory_width }}" height="{{ scene.memory_height }}" loading="lazy" decoding="async">
    </div>
    {%- endif -%}
    <div class="helios-possibility__plane helios-possibility__pool" aria-hidden="true"></div>
    <div class="helios-possibility__plane helios-possibility__thought" aria-hidden="true"></div>
    <div class="helios-possibility__plane helios-possibility__body">
      <img src="{{ scene.body | relative_url }}" alt="{{ scene.body_alt | escape }}" width="{{ scene.body_width }}" height="{{ scene.body_height }}" loading="lazy" decoding="async">
    </div>
    <div class="helios-possibility__plane helios-possibility__light" aria-hidden="true"></div>
    <figcaption>{{ item.caption }}</figcaption>
  </figure>
  <div class="helios-possibility__copy">
    <p class="helios-section__intro">{{ item.verse }}</p>
    <h2 class="helios-section__heading" id="create-title">{{ item.title }}</h2>
    <div class="helios-section__body">{{ item.body | markdownify }}</div>
    <a class="helios-section__call internal-link" href="{{ site.data.contact.route | relative_url }}">{{ item.action }} <span aria-hidden="true">↗</span></a>
  </div>
</div>
