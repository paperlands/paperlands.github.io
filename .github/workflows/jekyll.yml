name: To the Moon 🌙

# Every pull request is built and gated, whatever its base branch: the gates
# are what keep a reskin honest, so a PR aimed at master must run them or the
# only thing standing between it and production is review. Deploy is the one
# job that is not on the PR path — it waits for a push to master.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Per-path modification dates need history, not historical media blobs.
        with:
          fetch-depth: 0
          filter: blob:none

      # The stylesheet pipeline shells out to the CLI that ships inside the
      # `tailwindcss-ruby` gem (see _plugins/fast_styles.rb), so there is no
      # `curl releases/latest` step: an unpinned download of a moving target is
      # how a build breaks on a day nobody edited anything.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the still encoder
        run: npm ci --no-audit --no-fund

      # The still variants are content-addressed: toolchain/image-variants.mjs names
      # each rung after a hash of the source bytes, the width and the encoder
      # version. A stale entry therefore cannot be served wrong — the worst a miss
      # costs is one re-encode, never a wrong image — which is what makes it safe to
      # key on the recipe rather than on the output. Naming the sources in the key
      # means a new or replaced source misses, and a miss is what makes the entry be
      # saved again; it still restores the previous one through restore-keys, so only
      # the missing rungs are encoded. The encode is 62.7s of a 63.2s cold build: a
      # hit is the difference between that and 1.5s.
      - name: Restore the encoded stills
        uses: actions/cache@v6
        with:
          path: .jekyll-cache/image-variants
          key: image-variants-${{ hashFiles('_data/image_sources.yml', 'toolchain/image-variants.mjs', 'package-lock.json', 'assets/**/*.{webp,png,jpg,jpeg}') }}
          restore-keys: |
            image-variants-

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production


      - name: Verify stylesheet pipeline
        run: bundle exec ruby toolchain/test/fast_styles_test.rb

      - name: Verify shipped stylesheets
        run: bundle exec ruby toolchain/test/styles_artifact_test.rb

      - name: Verify publication and modification dates
        run: bundle exec ruby toolchain/test/metadata_test.rb

      - name: Verify the media player
        run: node --test toolchain/test/media-video.test.mjs
      - name: Verify page-local media boot
        run: bundle exec ruby toolchain/test/media_boot_test.rb
      - name: Verify generated media
        run: node toolchain/mint-media.mjs verify

      # One contract per step. A gate that shares a step with eleven others can
      # only shout "exit code 1" into a log nobody may read from an outside
      # session; a gate with its own step names itself in the checks API.
      - name: Verify compiled ink
        run: bundle exec ruby toolchain/test/compiled_ink_test.rb

      - name: Verify still variants
        run: node --test toolchain/test/image-variants.test.mjs

      - name: Verify the ink state machine
        run: node --test toolchain/test/ink-state.test.mjs

      - name: Verify image sources
        run: bundle exec ruby toolchain/test/image_sources_test.rb

      - name: Verify responsive Library covers
        run: bundle exec ruby toolchain/test/library_images_test.rb

      - name: Verify site markup
        run: bundle exec ruby toolchain/test/site_markup_test.rb

      - name: Verify the template text steps
        run: bundle exec ruby toolchain/test/text_steps_test.rb

      - name: Verify the notes edition
        run: bundle exec ruby toolchain/test/notes_edition_test.rb

      - name: Verify the experiences page
        run: bundle exec ruby toolchain/test/experiences_page_test.rb

      - name: Verify the media server's byte ranges
        run: python3 toolchain/test/media_serve_test.py

      - name: Verify the experiences lifecycle
        run: node --test toolchain/test/experiences-lifecycle.test.mjs

      - name: Verify the experiences stage
        run: node --test toolchain/test/experiences-stage.test.mjs

      - name: Verify the PaperLang release intake
        run: node --test toolchain/test/paperlang-release.test.mjs

      - name: Verify the PaperLang aliases
        run: SITE_DEST=_site bundle exec ruby toolchain/test/paperlang_aliases_test.rb

      - name: Verify the PaperLang served evidence
        run: python3 design/probe/paperlang.py --site _site

      - name: Verify the render window
        run: node --test toolchain/test/render-window.test.mjs

      - name: Verify the scroll clock
        run: node --test toolchain/test/scroll-clock.test.mjs

      # Generates service worker
      - name: generate sw
        run: npx --no-install workbox generateSW workbox-config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Audit the artifact already built and gated above; no second Ruby/npm build.
  budget:
    name: Front page budget
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-budget

      - name: Unpack built site
        run: |
          mkdir -p _site
          # upload-pages-artifact tars the site as artifact.tar; accept a plain
          # tree too, so a change in the action is not a broken budget job.
          if [ -f "$RUNNER_TEMP/pages-budget/artifact.tar" ]; then
            tar -xf "$RUNNER_TEMP/pages-budget/artifact.tar" -C _site
          else
            cp -a "$RUNNER_TEMP/pages-budget/." _site/
          fi
          test -f _site/index.html && echo "auditing $(du -sh _site | cut -f1) of built site"

      - name: Audit the production artifact
        uses: ./.github/actions/lighthouse

  deploy:
    name: To the Moon
    # A pull request is not a release. Without this guard every same-repo PR
    # carrying `pages: write` could publish itself to the live site.
    #
    # `workflow_call` keeps the old contract for a caller that deploys on
    # purpose; `workflow_dispatch` may redeploy master without an empty commit.
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Promotion is separate from ordinary byte-integrity tests. A dirty
      # development snapshot may build and be reviewed locally, but it must not
      # reach Pages as a versioned public runtime.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify PaperLang promotion
        run: node toolchain/vendor.mjs --promotion

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
