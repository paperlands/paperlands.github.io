{%- comment -%}
  Small decorative UI icons. Paths, rather than font glyphs, keep the shape
  consistent across platforms. The enclosing button/link supplies its label.
  Params: name (play, asterisk, arrow-up, arrow-up-right, expand, close).
{%- endcomment -%}
<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
  {%- case include.name -%}
    {%- when 'play' -%}
      <path d="M6 3 21 12 6 21Z" fill="currentColor"/>
    {%- when 'asterisk' -%}
      <path d="M12 3v18M3 12h18M5.64 5.64l12.72 12.72M5.64 18.36 18.36 5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    {%- when 'arrow-up' -%}
      <path d="M12 20V4m-7 7 7-7 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    {%- when 'arrow-up-right' -%}
      <path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    {%- when 'expand' -%}
      <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    {%- when 'close' -%}
      <path d="m6 6 12 12M6 18 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  {%- endcase -%}
</svg>
