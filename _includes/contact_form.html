<!-- https://india.fly.dev/proxy/apps/guru/work -->
<form id="lettertopaperland" class="flex w-full min-w-0 max-w-full flex-col space-y-4 {% if include.form_class %}{{ include.form_class }}{% else %}rounded-md bg-primary-light p-4 shadow-md sm:p-6{% endif %}" accept-charset="UTF-8" action="https://book.paperland.sg/proxy/apps/guru/work" method="POST">
  <label for="name-input" class="font-medium text-gray-700">Name*</label>
  <input id="name-input" type="text" name="name" placeholder="Alan Kay" class="w-full min-w-0 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary" />

  <label for="email-input" class="font-medium text-gray-700">Email*</label>
  <input id="email-input" type="email" name="email" placeholder="alan@paperland.sg" class="w-full min-w-0 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary" />

  <label for="message-input" class="font-medium text-gray-700">{% if include.message_label %}{{ include.message_label }}{% else %}Message*{% endif %}</label>
  <textarea id="message-input" name="message" rows="4" placeholder="{% if include.message_placeholder %}{{ include.message_placeholder }}{% else %}Tell us briefly about your context or background{% endif %}" class="w-full min-w-0 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"></textarea>

  <input type="hidden" name="return_url" value="{{ page.url | absolute_url }}" />

  <!--
    Turnstile flexible is width 100% with a 300px minimum; compact is 150px.
    Render explicitly from the host width so the widget never exceeds the form.
  -->
  <div id="cf-turnstile-host" class="w-full min-w-0">
    <div id="cf-turnstile-widget" class="flex w-full justify-center"></div>
  </div>
  <script>
    (function () {
      var SITEKEY = "0x4AAAAAACugliz5rFIg0aRA";
      var FLEXIBLE_MIN_PX = 300;
      var host = document.getElementById("cf-turnstile-host");
      var target = document.getElementById("cf-turnstile-widget");
      if (!host || !target) return;

      var widgetId = null;
      var currentSize = null;
      var booted = false;

      function desiredSize() {
        return host.clientWidth < FLEXIBLE_MIN_PX ? "compact" : "flexible";
      }

      function render() {
        if (!window.turnstile) return;
        var next = desiredSize();
        if (widgetId !== null && next === currentSize) return;
        // Keep a solved token if the viewport crosses 300px after success.
        if (widgetId !== null && turnstile.getResponse(widgetId)) return;
        if (widgetId !== null) {
          turnstile.remove(widgetId);
          widgetId = null;
        }
        currentSize = next;
        widgetId = turnstile.render(target, {
          sitekey: SITEKEY,
          theme: "light",
          size: next
        });
      }

      function boot() {
        if (booted || !window.turnstile) return;
        booted = true;
        render();
        if (typeof ResizeObserver !== "undefined") {
          new ResizeObserver(render).observe(host);
        }
      }

      window.onloadTurnstileCallback = boot;
      if (window.turnstile) boot();
    })();
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=onloadTurnstileCallback" defer></script>
  
  <button type="submit" class="px-4 py-2 {{ include.button_text_class | default: 'text-white' }} rounded-md bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary">{% if include.button_text %}{{ include.button_text }}{% else %}Book a call{% endif %}</button>
</form>

<div class="fixed z-50 hidden bottom-4 right-4" id="toast-good">
  <div class="flex items-center p-4 text-green-700 bg-green-100 border border-green-400 rounded-md shadow-md" >
      <i class="mr-2 fa fa-check-circle"></i>
      <span>Sent! To the desks <a class="text-blue-600 underline" href="/about"><b>@paperland</b></a></span>
      <button class="ml-auto text-gray-500 hover:text-gray-700 focus:outline-none" onclick="document.getElementById('toast-good').style.display = 'none';">X</button>
  </div>
</div>

<div class="fixed z-50 hidden bottom-4 right-4" id="toast-bad">
  <div class="flex items-center p-4 text-red-700 bg-red-100 border border-red-400 rounded-md shadow-md">
    <i class="mr-2 fa fa-check-circle"></i>
      <span>If you are human, please try again!  </span>
      <button class="ml-auto text-gray-500 hover:text-gray-700 focus:outline-none" onclick="document.getElementById('toast-bad').style.display = 'none';">X</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('sent') == "true") {
      const element = document.getElementById('toast-good');
      element.style.display = 'block'; // Show the element
  } else if (urlParams.get('sent') == "false") {
      const element = document.getElementById('toast-bad');
      element.style.display = 'block'; // Show the element
  }
</script>
