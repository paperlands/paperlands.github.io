title:               "We See Math Differently"
include:             ['_pages']
# The stylesheets are sources, not files to copy: all four sheets — `app.css`
# and the mode sheets — are built into the destination's assets/css/ by
# _plugins/fast_styles.rb. Excluding the tree keeps 200KB of raw sources (and
# their design commentary) out of the deploy.
exclude:             ['design', 'assets/css']
# The stylesheets are BUILT INTO the destination (see _plugins/fast_styles.rb),
# which is why they are excluded above — and which also puts them beyond
# Jekyll's cleaner: it deletes every file in the destination it did not produce,
# and without this line it sweeps the four sheets at CLEANUP and the pipeline
# rebuilds them from scratch, every build, cache or no cache.
keep_files:          ['assets/css']
# You may need to change the base URL depending on your deploy configuration.
url: "https://paperland.sg"
baseurl:             ''


# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink:           pretty

# FAIL CLOSED, in every environment and not only in development. These are the
# mistakes that otherwise ship silently:
#
#   error_mode strict        a template that does not parse stops the build,
#                            instead of warning and rendering what it can
#   strict_filters           an unknown filter stops the build. Liquid's default
#                            is to print the filter's INPUT unchanged, which is
#                            how a letter in _data/contact.yml once rendered
#                            with its `[[brackets]]` and its markdown intact —
#                            the failure _plugins/site_markup.rb documents at
#                            the top of the file
#   strict_front_matter      malformed front matter stops the build, instead of
#                            quietly dropping the page
#
# strict_variables is deliberately OFF, and it is not an oversight: absence is
# part of this site's data contract. `_includes/contact_form.html` reads
# `include.message_label`, `_includes/twilight/world_card.html` documents
# `date?/title?/description?/lesson_url?` as optional, `_data/festivals/gmff2026.yml`
# marks `grade` optional, and the header of every card include takes params the
# caller may not pass. Turning it on fails those templates for doing what they
# say they do.
liquid:
  error_mode:        strict
  strict_filters:    true
  strict_variables:  false
strict_front_matter: true

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap
  - jekyll-tailwind
  - jekyll-redirect-from

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  # Both scopes deliberately avoid a `*` in `path`.
  #
  # Jekyll's FrontmatterDefaults#applies_path? takes a Dir.glob branch whenever
  # the scope path contains a wildcard, and then iterates that globbed list
  # doing Pathname#relative_path_from FOR EVERY FILE. With `path: "**/*"` that
  # globbed the entire 131MB source tree and ran ~86,000 Pathname allocations
  # per build, inside `StaticFile#write?`, inside the CLEANUP phase.
  #
  # An empty path matches everything without globbing (`applies_path?` returns
  # true for an empty string), and a plain directory prefix takes the cheap
  # `start_with?` branch. Same behaviour, none of the globbing.
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "_notes/"
    values:
      layout: "note"
      # The edition is a dark document, so the shared nav needs light ink.
      # It was on the default 'light' tone — near-black ink on a dark ground —
      # and the nav's old mix-blend-mode hid it by accident rather than design.
      # There is no `nav:` key any more: one template serves every page.
      nav_tone: "dark"

tailwind:
  input: assets/css/app.css
  output: _site/assets/css/app.css
  minify: true

# css_modes — one stylesheet per surface, linked only where the surface is
# (see _plugins/css_modes.rb). A mode's name is its file's name: `page.look`
# names one on a look page (`look: helios` -> helios.css), and a layout names
# its own with `css_mode:` in its front matter (the note -> evening.css,
# Twilight -> twilight.css).
#
# What is NOT here is as deliberate: folio.css stays in app.css (it is the
# ground every folio page stands on, two declarations), as do the foundation
# sheets — tokens, lights, faces, the bar, the drawn mark, media, document.
css_modes:
  helios:
    input: assets/css/components/helios.css
    output: assets/css/mode-helios.css
  evening:
    input: assets/css/components/evening.css
    output: assets/css/mode-evening.css
  twilight:
    input: assets/css/components/twilight.css
    output: assets/css/mode-twilight.css
