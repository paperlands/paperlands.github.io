<section class="home-opening-hero" aria-labelledby="home-opening-title">
  <video id="home-opening-video" class="home-opening-hero__video"
    muted loop playsinline preload="metadata" controls
    poster="/assets/lib/landing/3DWaves.webp"
    aria-label="Students using PaperLand to explore mathematics">
    <source src="/assets/lib/home/hero/hero.mp4" type="video/mp4">
  </video>
  <div class="home-opening-hero__shade" aria-hidden="true"></div>
  <div class="home-opening-hero__content">
    <h1 id="home-opening-title">Mathematics<br>Reimagined</h1>
    <p>Coding mathematical visualisations made accessible for students.</p>
    <div class="home-opening-hero__actions">
      <a class="home-opening-hero__primary internal-link" href="/#work-with-us">Talk to us</a>
      <a class="home-opening-hero__secondary" href="https://dojo.paperland.sg/welcome">Enter PaperLand {% include home/icon-arrow.html direction="external" %}</a>
    </div>
  </div>
  <button class="home-opening-hero__playback" type="button" aria-controls="home-opening-video" hidden>
    <span class="home-opening-hero__playback-icon" aria-hidden="true">
      <svg data-playback-play viewBox="0 0 12 12" focusable="false"><path d="M3 2.25 9.5 6 3 9.75V2.25Z" fill="none" stroke="currentColor" stroke-width="1.15" /></svg>
      <svg data-playback-pause viewBox="0 0 12 12" focusable="false" hidden><path d="M3.5 2v8M8.5 2v8" fill="none" stroke="currentColor" stroke-width="1.25" /></svg>
    </span>
    <span data-playback-label>Play video</span>
  </button>
</section>
<script>
(() => {
  const video = document.getElementById('home-opening-video');
  const button = document.querySelector('.home-opening-hero__playback');
  const label = button.querySelector('[data-playback-label]');
  const playIcon = button.querySelector('[data-playback-play]');
  const pauseIcon = button.querySelector('[data-playback-pause]');
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const sync = () => {
    label.textContent = video.paused ? 'Play video' : 'Pause video';
    playIcon.hidden = !video.paused;
    pauseIcon.hidden = video.paused;
  };
  video.controls = false;
  button.hidden = false;
  video.addEventListener('play', sync);
  video.addEventListener('pause', sync);
  button.addEventListener('click', () => {
    if (video.paused) video.play().catch(sync);
    else video.pause();
  });
  // Never start motion before checking the visitor's preference.
  if (!motion.matches) video.play().catch(sync);
  motion.addEventListener('change', () => {
    if (motion.matches) video.pause();
  });
  const menu = document.querySelector('.home-opening-nav__menu');
  menu.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      menu.open = false;
      menu.querySelector('summary').focus();
    }
  });
  menu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => { menu.open = false; }));
})();
</script>
