name: Performance budget

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: Front page budget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No `curl releases/latest`: the stylesheet pipeline uses the CLI inside
      # the `tailwindcss-ruby` gem (_plugins/fast_styles.rb).
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the still encoder
        run: npm ci

      # The gate measures the first-party page. JEKYLL_ENV stays development so
      # the async analytics script (production only) cannot make a budget flaky;
      # the deployed build's own assets are the ones this job is protecting.
      - name: Build
        run: bundle exec jekyll build

      - name: Verify generated media
        run: node design/mint-media.mjs verify

      - name: Lighthouse CI
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15 autorun 2>&1 | tee lhci.log

      # A failed job's log needs admin on the repository, but annotations do
      # not. Without this, a red budget is an anonymous "exit code 1" and the
      # reason (Chrome not found, server never ready, an assertion) has to be
      # guessed from a laptop. `tail` keeps it inside the annotation limit.
      - name: Explain a failed budget
        if: failure()
        run: |
          if [ ! -s lhci.log ]; then
            echo "::error title=Lighthouse CI::autorun wrote no log at all"
            exit 0
          fi
          tail -n 60 lhci.log | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
            echo "::error title=Lighthouse CI::$line"
          done

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouseci
          path: |
            .lighthouseci
            lhci.log
          if-no-files-found: warn
