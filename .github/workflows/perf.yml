name: Performance budget

on:
  # PR budgets run in jekyll.yml using the already-built Pages artifact.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: Front page budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Install the still encoder
        run: npm ci --no-audit --no-fund

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify generated media
        run: node design/mint-media.mjs verify

      # Analytics are blocked by .lighthouserc.json, keeping this first-party.
      - name: Audit the production build
        uses: ./.github/actions/lighthouse
