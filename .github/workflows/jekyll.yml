name: To the Moon 🌙

# Every pull request is built and gated, whatever its base branch: the gates
# are what keep a reskin honest, so a PR aimed at master must run them or the
# only thing standing between it and production is review. Deploy is the one
# job that is not on the PR path — it waits for a push to master.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The stylesheet pipeline shells out to the CLI that ships inside the
      # `tailwindcss-ruby` gem (see _plugins/fast_styles.rb), so there is no
      # `curl releases/latest` step: an unpinned download of a moving target is
      # how a build breaks on a day nobody edited anything.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the still encoder
        run: npm ci --no-audit --no-fund

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify generated media
        run: node design/mint-media.mjs verify

      # One contract per step. A gate that shares a step with eleven others can
      # only shout "exit code 1" into a log nobody may read from an outside
      # session; a gate with its own step names itself in the checks API.
      - name: Verify compiled ink
        run: bundle exec ruby design/probe/compiled_ink_test.rb

      - name: Verify still variants
        run: node --test design/probe/image-variants.test.mjs

      - name: Verify the ink state machine
        run: node --test design/probe/ink-state.test.mjs

      - name: Verify image sources
        run: bundle exec ruby design/probe/image_sources_test.rb

      - name: Verify site markup
        run: bundle exec ruby design/probe/site_markup_test.rb

      - name: Verify the notes edition
        run: bundle exec ruby design/probe/notes_edition_test.rb

      - name: Verify the experiences page
        run: bundle exec ruby design/probe/experiences_page_test.rb

      - name: Verify the media server's byte ranges
        run: python3 design/probe/media_serve_test.py

      - name: Verify the experiences lifecycle
        run: node --test design/probe/experiences-lifecycle.test.mjs

      - name: Verify the experiences stage
        run: node --test design/probe/experiences-stage.test.mjs

      - name: Verify the host release
        run: node --test design/probe/host-release.test.mjs

      - name: Verify the render window
        run: node --test design/probe/render-window.test.mjs

      - name: Verify the scroll clock
        run: node --test design/probe/scroll-clock.test.mjs

      # Generates service worker
      - name: generate sw
        run: npx --no-install workbox generateSW workbox-config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Audit the artifact already built and gated above; no second Ruby/npm build.
  budget:
    name: Front page budget
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-budget

      - name: Unpack built site
        run: |
          mkdir -p _site
          # upload-pages-artifact tars the site as artifact.tar; accept a plain
          # tree too, so a change in the action is not a broken budget job.
          if [ -f "$RUNNER_TEMP/pages-budget/artifact.tar" ]; then
            tar -xf "$RUNNER_TEMP/pages-budget/artifact.tar" -C _site
          else
            cp -a "$RUNNER_TEMP/pages-budget/." _site/
          fi
          test -f _site/index.html && echo "auditing $(du -sh _site | cut -f1) of built site"

      - name: Audit the production artifact
        uses: ./.github/actions/lighthouse

  deploy:
    name: To the Moon
    # A pull request is not a release. Without this guard every same-repo PR
    # carrying `pages: write` could publish itself to the live site.
    #
    # `workflow_call` keeps the old contract for a caller that deploys on
    # purpose; `workflow_dispatch` may redeploy master without an empty commit.
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
