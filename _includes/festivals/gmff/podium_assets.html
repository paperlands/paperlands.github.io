<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root { --gmff-ink: #10100E; --gmff-paper: #F2E7D5; --gmff-sienna: #C84F23; --gmff-sun: #F2A65A; }

.gmff-results { max-width: 960px; margin: 0 auto; }
.gmff-results__title { margin: 0 0 2rem; color: var(--gmff-paper); font: 700 .72rem 'Orbitron', monospace; letter-spacing: .18em; text-align: center; text-transform: uppercase; }
.gmff-podium-row { display: flex; align-items: end; justify-content: center; gap: .85rem; }
.podium-position { width: 15rem; min-width: 0; order: var(--podium-order); }
.podium-position-1 { --podium-order: 2; width: 20rem; }
.podium-position-2 { --podium-order: 1; }
.podium-position-3 { --podium-order: 3; }

.podium-card, .finalist-card { display: flex; flex-direction: column; border: 1px solid rgba(242, 231, 213, .22); background: #181512; transition: border-color .2s ease, transform .2s ease; }

.card-inner { position: relative; flex: 1; overflow: hidden; }
.medal, .shimmer-overlay { display: none; }
.podium-card + div > span { color: #D8CCB8 !important; font-size: .68rem; opacity: 1 !important; }
.podium-position-1 .podium-card + div > span { color: var(--gmff-sun) !important; }

.watch-panel, .finalist-watch-panel { display: block; width: 100%; border: 0; border-bottom: 1px solid rgba(242, 231, 213, .16); background: transparent; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer; }

.watch-inner { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 16px 18px; }
.finalist-watch-inner { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 12px 14px; }
.platform-glyph { width: 26px; height: 26px; flex: 0 0 auto; color: var(--gmff-sun); }

[data-gmff-modal] { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(16, 16, 14, .86); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s ease, visibility .2s ease; }
